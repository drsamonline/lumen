name: release

# Produces installable builds and attaches them to a GitHub Release.
#   push a tag:        git tag v1.6.0 && git push origin v1.6.0
#   or run it by hand: Actions -> release -> Run workflow, with the tag name
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v1.6.0'
        required: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.27.4
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  windows:
    name: Windows build
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter doctor -v
      - run: flutter pub get
      - run: flutter create --platforms=windows --project-name lumen .
      - run: flutter build windows --release --dart-define=APP_VERSION=${{ env.TAG }}
      - name: Package
        shell: pwsh
        run: |
          $out = "build/windows/x64/runner/Release"
          Compress-Archive -Path "$out/*" -DestinationPath "lumen-$env:TAG-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: lumen-${{ env.TAG }}-windows-x64.zip
          if-no-files-found: error

  linux:
    name: Linux build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libblkid-dev libsecret-1-dev libsqlite3-0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter create --platforms=linux --project-name lumen .
      - run: flutter build linux --release --dart-define=APP_VERSION=${{ env.TAG }}
      - name: Package
        run: |
          cd build/linux/x64/release
          tar -czf "$GITHUB_WORKSPACE/lumen-${TAG}-linux-x64.tar.gz" bundle
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: lumen-${{ env.TAG }}-linux-x64.tar.gz
          if-no-files-found: error

  android:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter create --platforms=android --project-name lumen .
      # flutter create writes a bare manifest with no storage permission, so an
      # installed APK asks for nothing and finds no photos.
      - name: Add the permissions the app needs
        run: python3 tools/android_permissions.py .
      - name: Show the resulting manifest
        run: sed -n '1,40p' android/app/src/main/AndroidManifest.xml
      # No keystore in this repo, so the template's release buildType signs with
      # the debug key. Fine for sideloading; Play Store would need a real key.
      - run: flutter build apk --release --dart-define=APP_VERSION=${{ env.TAG }}
      - name: Package
        run: cp build/app/outputs/flutter-apk/app-release.apk "lumen-${TAG}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: lumen-${{ env.TAG }}-android.apk
          if-no-files-found: error

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [windows, linux, android]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List what will be attached
        run: ls -lh dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Lumen ${{ env.TAG }}
          draft: false
          generate_release_notes: true
          body: |
            Installable builds of Lumen, produced by CI from this tag.

            | Platform | File | How to run |
            |---|---|---|
            | Windows 10/11 x64 | `lumen-${{ env.TAG }}-windows-x64.zip` | Unzip anywhere and run `lumen.exe`. No installer, no registry writes. |
            | Linux x64 | `lumen-${{ env.TAG }}-linux-x64.tar.gz` | `tar -xzf …` then `./bundle/lumen`. Needs GTK 3 and libsecret. |
            | Android 6+ | `lumen-${{ env.TAG }}-android.apk` | Sideload it. Signed with a debug key, so enable "install unknown apps". |

            ### Headless CLI

            `bin/lumen.dart` is the same index and scanner without the interface.
            It runs with `dart run bin/lumen.dart <command>` from a Flutter
            checkout; a standalone compiled binary is not shipping yet, because
            the database layer still imports the Flutter wrapper `package:sqflite`
            and `dart compile exe` cannot link the engine. Moving those types to
            `sqflite_common` is the fix.

            **Windows and Linux:** the app needs a folder to index. On first run it
            asks; point it at your photos. Nothing is copied, moved or uploaded.

            **Android:** tap *Use camera roll* on the setup screen; it adds DCIM,
            Pictures and Download automatically.

            Everything here is offline. The only socket the app opens is the LAN
            gallery, and only when you turn it on.
          files: dist/*
          fail_on_unmatched_files: true
