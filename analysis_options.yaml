include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # An unused import is a warning, and warnings are fatal in CI.
    unused_import: warning

linter:
  rules:
    avoid_print: true
    # Off deliberately. This codebase writes multi-line SQL with """ blocks,
    # and prefer_single_quotes has no notion of "this string is a query" — it
    # would force ''' around every CREATE TABLE, which then breaks the moment a
    # query contains an apostrophe.
    prefer_single_quotes: false
